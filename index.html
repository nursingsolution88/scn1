<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjeevani College Attendance Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
        }

        /* ब्लिंकिंग और कलरफुल हेडिंग */
        .blinking-title {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            animation: colorBlink 1.2s infinite;
        }

        @keyframes colorBlink {
            0% { color: #ffeb3b; text-shadow: 0 0 10px #ffeb3b; opacity: 1; }
            25% { color: #00e676; text-shadow: 0 0 15px #00e676; opacity: 0.85; }
            50% { color: #00e5ff; text-shadow: 0 0 20px #00e5ff; opacity: 0.5; }
            75% { color: #ff4081; text-shadow: 0 0 15px #ff4081; opacity: 0.9; }
            100% { color: #ffeb3b; text-shadow: 0 0 10px #ffeb3b; opacity: 1; }
        }

        /* लार्ज अटेंडेंस बटन */
        .large-btn {
            background: linear-gradient(45deg, #ff0844, #ffb199);
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(255, 8, 68, 0.55);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .large-btn:hover {
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 16px 35px rgba(255, 8, 68, 0.75);
        }

        /* --- 100% FULL SCREEN FRAME OVERLAY --- */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 10000;
        }

        .fullscreen-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* फुल स्क्रीन बंद करने का फ्लोटिंग बटन */
        .close-fullscreen-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            z-index: 10001;
            background: #ff0844;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.2s;
        }

        .close-fullscreen-btn:hover {
            background: #d00034;
            transform: scale(1.05);
        }

        /* हॉस्टल ऐड पॉपअप (Modal) */
        .ad-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .ad-card {
            background: linear-gradient(135deg, #ffffff, #f9fafb);
            color: #333;
            max-width: 480px;
            width: 100%;
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: zoomIn 0.3s ease-out;
            border: 4px solid #25D366;
        }

        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .ad-badge {
            background: #ff0844;
            color: #fff;
            padding: 5px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .ad-card h2 {
            color: #1a237e;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .ad-card p {
            font-size: 1rem;
            color: #444;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        /* WhatsApp बटन */
        .whatsapp-btn {
            background-color: #25D366;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 26px;
            border-radius: 35px;
            font-size: 1.15rem;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);
            margin-bottom: 16px;
            transition: 0.2s ease;
            width: 100%;
        }

        .whatsapp-btn:hover {
            background-color: #1ebe5d;
            transform: scale(1.02);
        }

        .continue-btn {
            background: #1d2671;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
        }

        .continue-btn:hover {
            background: #11174b;
        }

        @media (max-width: 600px) {
            .blinking-title {
                font-size: 1.5rem;
            }
            .large-btn {
                font-size: 1.2rem;
                padding: 16px 32px;
            }
        }
    </style>
</head>
<body>

    <!-- हेडिंग -->
    <div class="header-box">
        <h1 class="blinking-title">SANJEEVANI COLLEGE ATTENDANCE</h1>
    </div>

    <!-- अटेंडेंस व्यू बटन -->
    <div>
        <button class="large-btn" onclick="handleAttendanceClick()">📋 ATTENDANCE VIEW</button>
    </div>

    <!-- 100% फुल स्क्रीन पोर्टल व्यू -->
    <div class="fullscreen-overlay" id="fullScreenBox">
        <button class="close-fullscreen-btn" onclick="closeFullScreen()">✕ Close View</button>
        <iframe id="attendanceFrame" src="" title="Attendance View"></iframe>
    </div>

    <!-- सिद्धि हॉस्टल ऐड पॉपअप -->
    <div class="ad-modal" id="hostelAdModal">
        <div class="ad-card">
            <span class="ad-badge">SPECIAL ADMISSION OFFER</span>
            <h2>🏢 SIDDHI GIRLS & BOYS HOSTEL</h2>
            <p>शांत वातावरण, उत्तम भोजन, 24/7 वाई-फाई और सुरक्षित परिवेश।<br>सीमित सीटें उपलब्ध हैं! अभी संपर्क करें।</p>
            
            <!-- WhatsApp बटन -->
            <a href="https://wa.me/917683070771?text=Hello,%20I%20want%20information%20regarding%20Siddhi%20Girls%20&%20Boys%20Hostel" target="_blank" class="whatsapp-btn">
                💬 Chat on WhatsApp (+91 76830 70771)
            </a>

            <!-- आगे बढ़ने का बटन -->
            <button class="continue-btn" onclick="closeAdAndOpenFullScreen()">Proceed to Attendance ➜</button>
        </div>
    </div>

    <script>
        const targetUrl = "https://script.google.com/macros/s/AKfycbxsue2xunkXFDE3C-oQMWadkLU05kadRmmF6NhYoWa3QdAr3FkOlfIFxOeC1t-z_6jr/exec";
        let isFirstClick = true;

        function handleAttendanceClick() {
            if (isFirstClick) {
                document.getElementById('hostelAdModal').style.display = 'flex';
                isFirstClick = false;
            } else {
                openFullScreen();
            }
        }

        function closeAdAndOpenFullScreen() {
            document.getElementById('hostelAdModal').style.display = 'none';
            openFullScreen();
        }

        function openFullScreen() {
            const overlay = document.getElementById('fullScreenBox');
            const frame = document.getElementById('attendanceFrame');

            overlay.style.display = 'block';
            if (frame.src !== targetUrl) {
                frame.src = targetUrl;
            }
            document.body.style.overflow = 'hidden'; // बैकग्राउंड स्क्रॉल लॉक
        }

        function closeFullScreen() {
            document.getElementById('fullScreenBox').style.display = 'none';
            document.body.style.overflow = 'auto'; // स्क्रॉल वापस चालू
        }
    </script>
</body>
</html>
